  @media print { header.top, .noprint { display:none !important; } }
</style>

<script type="module">

  apiKey: "AIzaSyBla6UBluNcWVKPSU8U30IuTSubLb7R2Kc", authDomain: "hae-vuma-92fca.firebaseapp.com", projectId: "hae-vuma-92fca",

$('loginBtn').addEventListener('click', async () => { $('authError').textContent = ''; try { await signInWithEmailAndPassword(auth, $('loginEmail').value.trim(), $('loginPassword').value); } catch (e) { $('authError').textContent = 'Sign-in failed: ' + (e.code || e.message); } });

onAuthStateChanged(auth, async (user) => {

  if (!levels.some((l) => ['executive', 'hr', 'finance'].includes(l))) { $('view').innerHTML = '<div class="note">This tool is for executive, HR and finance. Ask the COO for access.</div>'; return; }
  const today = new Date(); const ps = R.periodsForMonth(today.getFullYear(), today.getMonth() + 1); const t = R.iso(today.getFullYear(), today.getMonth() + 1, today.getDate());
  const pp = t <= ps[1].to ? ps[1] : ps[2]; win = { start: pp.from, end: pp.to };
  const qs = new URLSearchParams(location.search); if (/^\d{4}-\d\d-\d\d$/.test(qs.get('start') || '') && /^\d{4}-\d\d-\d\d$/.test(qs.get('end') || '')) win = { start: qs.get('start'), end: qs.get('end') };
  await loadAll(); render();
});

async function loadAll() {
  try { const r = await getDoc(doc(db, 'timesheet_config', 'rates')); rates = r.exists() ? r.data().rates : null; } catch (e) { console.warn(e); }
  groups = {}; people = [];
  for (const g of GROUPS) {
    try { const c = await getDoc(doc(db, 'roster_config', g)); if (!c.exists()) continue; const cfg = c.data(); const canEdit = me.isExec || (cfg.editTiers || []).some((t) => me.levels.includes(t));
      const q = canEdit ? query(collection(db, 'roster_periods'), where('groupId', '==', g)) : query(collection(db, 'roster_periods'), where('groupId', '==', g), where('status', '==', 'published'));

      for (const r of cfg.people || []) if (!people.find((p) => p.id === r.personId)) people.push({ id: r.personId, name: r.name });

async function loadSaved() { try { saved = (await getDocs(query(collection(db, 'timesheet_entries'), where('payStart', '==', win.start)))).docs.map((d) => d.data()); } catch (e) { saved = []; console.warn(e); } }

function render() {

  const custom = !ps.find((p) => p.from === win.start && p.to === win.end) ? `<option value="${win.start}|${win.end}" selected>${dm(win.start)} to ${dm(win.end)}</option>` : '';
  $('view').innerHTML = `<div class="bar"><div class="nav"><b>Pay run</b> <select id="winSel" style="width:auto">${custom}${sel}</select></div><div class="muted">Hourly pay runs: 1st to 15th and 16th to month end (payroll app)</div></div>
    ${rates ? '' : '<div class="warnbox">Hourly rates are not set up yet, so amounts cannot be checked. An executive must create the rates (RN, EN, ENA) first.</div>'}
    <div class="note">Scan the signed sheets (photo or PDF, one sheet per person), drop them here, then check each one against what was written. Nothing is saved until you press <b>Accept</b>. Pictures are not stored; keep the paper.</div>
    <div class="drop" id="drop">Drop scanned sheets here or <button class="btn small" id="pick">choose files</button><input type="file" id="file" accept="image/*,application/pdf" multiple style="display:none"></div>
    <div id="cards"></div><div id="summary"></div>`;
  $('winSel').onchange = async (e) => { const [a, b] = e.target.value.split('|'); win = { start: a, end: b }; await loadSaved(); cards.forEach((c) => (c.saved = false)); render(); drawCards(); };
  const drop = $('drop'); $('pick').onclick = () => $('file').click(); $('file').onchange = (e) => addFiles([...e.target.files]);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); }; drop.ondragleave = () => drop.classList.remove('over'); drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); addFiles([...e.dataTransfer.files]); };

}
async function shrink(file) {
  if (file.type === 'application/pdf') return { mediaType: 'application/pdf', data: await b64(file), url: URL.createObjectURL(file) };

}
const b64 = (blob) => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(String(f.result).split(',')[1]); f.onerror = rej; f.readAsDataURL(blob); });

}

}
function analyse(sh) {

}
const stCls = { match: 'match', 'worked-not-rostered': 'bad', 'different-shift': 'warn', 'rostered-not-worked': 'bad', 'no-roster': 'na' };
const stTxt = { match: 'Matches roster', 'worked-not-rostered': 'Not on roster', 'different-shift': 'Rostered for the other shift', 'rostered-not-worked': 'Rostered, not on sheet', 'no-roster': 'No roster' };

  const rows = n.rows.map((r, i) => { const inWin = !r.struck && T.inPeriod(r.date, win); const line = a.cmp && inWin ? a.cmp.lines.find((l) => l.date === r.date && l.shift === r.shift && l.status !== 'rostered-not-worked') : null; const s = sh.raw.shifts[i];
    return `<tr class="${r.struck ? 'struck' : ''} ${!r.struck && !inWin ? 'out' : ''}"><td><input type="text" data-f="date" data-i="${i}" value="${esc(s.date)}"></td><td><input type="text" data-f="in" data-i="${i}" value="${esc(s.in)}"></td><td><input type="text" data-f="out" data-i="${i}" value="${esc(s.out)}"></td><td><input type="text" data-f="hours" data-i="${i}" value="${esc(s.hours)}"></td><td><input type="checkbox" data-f="struck" data-i="${i}" ${s.struck ? 'checked' : ''} title="Struck out on the sheet"></td>
      <td>${r.shift ? (r.extension ? 'extra hours' : r.shift) : ''}</td><td>${r.struck ? '' : inWin ? '<span class="st match">in pay run</span>' : '<span class="st na">outside</span>'}</td><td>${line ? `<span class="st ${stCls[line.status]}">${stTxt[line.status]}</span>` : ''}</td></tr>`; }).join('');
  const missed = a.cmp ? a.cmp.lines.filter((l) => l.status === 'rostered-not-worked') : [];
  return `<div class="sheet ${sh.saved ? 'done' : ''}" data-sheet="${sh.id}"><div class="hd"><b>${esc(c.file)}</b><span class="muted">sheet says: ${esc(sh.raw.name || '?')} · ${esc(sh.raw.rank || '?')} · ${esc(sh.raw.month || '')}</span><span style="flex:1"></span>${sh.saved ? '<span class="badge ok">Accepted</span>' : ''}<button class="btn small ghost" data-rm="${c.id}">Remove</button></div>
   <div class="bd"><div>${c.url ? (c.isPdf ? `<a href="${c.url}" target="_blank">Open the PDF</a>` : `<a href="${c.url}" target="_blank"><img class="thumb" src="${c.url}" alt="scan"></a>`) : ''}</div>
   <div><div class="field"><label>Staff member (matched to the roster list)</label><select data-pid><option value="">Choose…</option>${opts}</select></div>
    <div class="kv"><div>Hours in this pay run<b>${a.sp.hours}</b></div><div>Rate<b>${n.rate ?? '—'}</b></div><div>Amount<b>${a.amount != null ? 'R ' + a.amount.toFixed(2) : '—'}</b></div><div>Sheet total hours<b>${n.totalHours ?? '—'}</b></div><div>Sheet amount<b>${n.writtenAmount ?? '—'}</b></div>${a.cmp ? `<div>Roster check<b>${a.cmp.match} of ${a.sp.inside.length} match</b></div>` : ''}</div>
    ${a.flags.length ? `<ul class="flags">${a.flags.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : '<div class="badge ok" style="margin:4px 0">No problems found</div>'}
    <table class="rows"><thead><tr><th>Date</th><th>In</th><th>Out</th><th>Hours</th><th>Struck</th><th>Shift</th><th>Pay run</th><th>Roster</th></tr></thead><tbody>${rows}</tbody></table>
    ${missed.length ? `<div class="warnbox">Rostered but not on this sheet: ${missed.map((l) => dm(l.date) + ' ' + l.shift).join(', ')}</div>` : ''}
    <div class="modal-actions"><button class="btn solid" data-accept ${sh.personId && a.sp.inside.length ? '' : 'disabled'}>${sh.saved ? 'Save changes' : 'Accept for this pay run'}</button></div></div></div></div>`;
}
function wireCards() {
  document.querySelectorAll('[data-rm]').forEach((b) => { b.onclick = () => { cards = cards.filter((c) => c.id !== b.dataset.rm); drawCards(); }; });
  document.querySelectorAll('[data-sheet]').forEach((el) => {
    const sh = cards.flatMap((c) => c.sheets).find((s) => s.id === el.dataset.sheet); if (!sh) return;
    el.querySelector('[data-pid]').onchange = (e) => { sh.personId = e.target.value; sh.saved = false; drawCards(); };
    el.querySelectorAll('input[data-f]').forEach((inp) => { inp.onchange = () => { const s = sh.raw.shifts[+inp.dataset.i]; s[inp.dataset.f] = inp.type === 'checkbox' ? inp.checked : inp.value; sh.saved = false; drawCards(); }; });
    el.querySelector('[data-accept]').onclick = () => accept(sh);
  });
}
async function accept(sh) {
  const a = analyse(sh); const p = people.find((x) => x.id === sh.personId); const id = `${win.start}_${sh.personId}`;
  if (saved.find((s) => s.personId === sh.personId) && !sh.saved && !confirm(`${p.name} already has hours saved for this pay run. Replace them?`)) return;
  const entry = { payStart: win.start, payEnd: win.end, personId: sh.personId, name: p.name, rank: a.n.rank || '', rankKey: a.n.rankKey || '', rate: a.n.rate ?? 0, hours: a.sp.hours, amount: a.amount ?? 0, sheetHours: a.n.totalHours ?? 0, sheetAmount: a.n.writtenAmount ?? 0,
    shifts: a.sp.inside.map((r) => ({ date: r.date, shift: r.shift || '', hours: r.hours, extension: !!r.extension })), flags: a.flags.slice(0, 20), roster: a.cmp ? { match: a.cmp.match, workedNotRostered: a.cmp.workedNotRostered, differentShift: a.cmp.differentShift, rosteredNotWorked: a.cmp.rosteredNotWorked, noRoster: a.cmp.noRoster } : null, status: 'verified', verifiedBy: me.email, verifiedAt: serverTimestamp() };
  try { await setDoc(doc(db, 'timesheet_entries', id), entry); sh.saved = true; await loadSaved(); toast(`${p.name}: ${a.sp.hours} hours saved.`); drawCards(); } catch (e) { toast('Could not save: ' + (e.code || e.message), 'error'); }
}
function drawSummary() {
  const el = $('summary'); if (!el) return; const have = new Set(saved.map((s) => s.personId));
  const onRoster = people.filter((p) => { const m = rosterFor(p.id); for (const d of m.keys()) if (d >= win.start && d <= win.end) return true; return false; });
  const missing = onRoster.filter((p) => !have.has(p.id)); const tot = saved.reduce((a, s) => a + s.hours, 0);
  el.innerHTML = `<div class="card"><h3>This pay run: ${dm(win.start)} to ${dm(win.end)}</h3><div class="kv"><div>Sheets accepted<b>${saved.length}</b></div><div>Hours accepted<b>${T.money(tot)}</b></div><div>On the roster, no sheet yet<b>${missing.length}</b></div></div>
   ${saved.length ? `<table class="t"><thead><tr><th>Name</th><th>Rank</th><th class="n">Hours</th><th class="n">Amount</th><th>Roster check</th><th>By</th></tr></thead><tbody>${saved.sort((a, b) => a.name.localeCompare(b.name)).map((s) => `<tr><td>${esc(s.name)}</td><td>${esc(s.rank)}</td><td class="n">${s.hours}</td><td class="n">R ${Number(s.amount).toFixed(2)}</td><td>${s.roster ? `${s.roster.match} match${s.roster.workedNotRostered ? ', ' + s.roster.workedNotRostered + ' not rostered' : ''}${s.roster.rosteredNotWorked ? ', ' + s.roster.rosteredNotWorked + ' rostered not worked' : ''}` : '—'}</td><td class="muted">${esc(s.verifiedBy)}</td></tr>`).join('')}</tbody></table>` : '<div class="muted">Nothing accepted yet.</div>'}
   ${missing.length ? `<div class="warnbox" style="margin-top:10px">On the roster in this pay run but no sheet accepted: ${missing.map((p) => esc(p.name)).join(', ')}</div>` : ''}</div>`;
}
</script>
