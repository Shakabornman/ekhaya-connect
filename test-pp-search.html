<!DOCTYPE html>
<!-- LOCAL TEST ONLY — do not commit to GitHub, do not deploy anywhere -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ppSearchAI — local test</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; }
  input, button { font-size: 14px; padding: 8px 12px; margin: 4px 0; }
  input[type="text"] { width: 100%; box-sizing: border-box; }
  #status { color: #666; font-size: 13px; margin: 10px 0; }
  pre { background: #f5f5f5; padding: 12px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; }
  .error { color: #a32d2d; }
</style>
</head>
<body>
  <h2>ppSearchAI — local test tool</h2>
  <p>Not part of the live site. Sign in, ask a question, see the raw response.</p>

  <div id="signin-box">
    <input type="email" id="email" placeholder="Your email">
    <input type="password" id="password" placeholder="Your password">
    <button onclick="doSignIn()">Sign in</button>
  </div>

  <div id="test-box" style="display:none;">
    <p>Signed in as <span id="whoami"></span></p>
    <input type="text" id="question" placeholder="e.g. what do I do if a patient refuses treatment">
    <button onclick="runSearch()">Ask</button>
    <div id="status"></div>
    <pre id="result"></pre>
  </div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
  import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';

  const firebaseConfig = {
    apiKey:            "AIzaSyBla6UBluNcWVKPSU8U30IuTSubLb7R2Kc",
    authDomain:        "hae-vuma-92fca.firebaseapp.com",
    projectId:         "hae-vuma-92fca",
    storageBucket:     "hae-vuma-92fca.firebasestorage.app",
    messagingSenderId: "1052424261313",
    appId:             "1:1052424261313:web:a4bebe68d6f9ba14fa0e40"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const functions = getFunctions(app, 'europe-west1');

  window.doSignIn = async () => {
    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('password').value;
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
      alert('Sign in failed: ' + e.message);
    }
  };

  onAuthStateChanged(auth, user => {
    if (user) {
      document.getElementById('signin-box').style.display = 'none';
      document.getElementById('test-box').style.display = 'block';
      document.getElementById('whoami').textContent = user.email;
    }
  });

  window.runSearch = async () => {
    const question = document.getElementById('question').value.trim();
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    if (!question) { statusEl.textContent = 'Type a question first.'; return; }

    statusEl.textContent = 'Calling ppSearchAI...';
    resultEl.textContent = '';

    try {
      const ppSearchAI = httpsCallable(functions, 'ppSearchAI');
      const start = performance.now();
      const res = await ppSearchAI({ question });
      const elapsed = Math.round(performance.now() - start);
      statusEl.textContent = `Done in ${elapsed}ms`;
      resultEl.textContent = JSON.stringify(res.data, null, 2);
    } catch (e) {
      statusEl.innerHTML = '<span class="error">Error: ' + e.code + ' — ' + e.message + '</span>';
      resultEl.textContent = '';
    }
  };
</script>
</body>
</html>
