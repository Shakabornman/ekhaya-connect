<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Events and Calendar — Hospital at Ekhaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0F2A43; --ink-soft:#4A5C70; --paper:#F7F6F2; --line:#E3DFD4; --gold:#B8912F; --gold-soft:#F1E7CD; --danger:#A6303A; --danger-soft:#F8E4E6; --blue:#1E5F8F; --blue-soft:#E8F1F8; --gray-soft:#EDEDED; --radius:3px; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; font-size:14px; }
  h1,h2,h3 { font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em; }
  #authScreen { min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px; }
  .seal { width:56px; height:56px; border-radius:50%; border:2px solid var(--gold); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:22px; color:var(--gold); }
  .auth-card { background:#fff; border:1px solid var(--line); padding:40px; width:340px; max-width:92vw; text-align:center; }
  .auth-card h1 { font-size:20px; margin:12px 0 4px; } .auth-card p { color:var(--ink-soft); margin:0 0 20px; font-size:13px; }
  .auth-card input { width:100%; padding:10px 12px; margin-bottom:10px; border:1px solid var(--line); border-radius:var(--radius); font:inherit; }
  .auth-card button { width:100%; padding:10px 12px; background:var(--ink); color:#fff; border:none; border-radius:var(--radius); font-weight:600; font-size:13px; cursor:pointer; }
  #authError { color:var(--danger); font-size:12px; min-height:16px; margin-top:6px; }
  #app { display:none; }
  header.top { background:var(--ink); color:#fff; padding:22px 36px; display:flex; align-items:baseline; justify-content:space-between; gap:16px; }
  header.top .eyebrow { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-soft); opacity:.85; }
  header.top h1 { color:#fff; font-size:24px; margin:2px 0 0; }
  header.top .who { font-size:12px; color:#c7d2df; text-align:right; }
  header.top .who button { background:none; border:1px solid #3c5a76; color:#dce6ef; padding:4px 10px; border-radius:var(--radius); font-size:11px; margin-top:6px; cursor:pointer; }
  main { padding:24px 36px 60px; max-width:1200px; margin:0 auto; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .nav { display:flex; align-items:center; gap:10px; } .nav h2 { margin:0; font-size:26px; min-width:150px; text-align:center; }
  .btn { padding:8px 14px; border-radius:var(--radius); border:1px solid var(--ink); background:#fff; color:var(--ink); font-weight:600; font-size:13px; cursor:pointer; font-family:inherit; }
  .btn.solid { background:var(--ink); color:#fff; } .btn.danger { background:var(--danger); border-color:var(--danger); color:#fff; } .btn.ghost { border-color:var(--line); color:var(--ink-soft); } .btn.small { padding:4px 10px; font-size:12px; } .btn:disabled { opacity:.5; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:20px; padding:4px 11px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px; font-family:inherit; color:var(--ink); }
  .chip .dot { width:9px; height:9px; border-radius:50%; } .chip.off { opacity:.4; }
  .filters input { padding:7px 12px; border:1px solid var(--line); border-radius:var(--radius); font:inherit; font-size:13px; width:220px; max-width:100%; }
  .card { background:#fff; border:1px solid var(--line); padding:16px 18px; margin-bottom:16px; }
  .card h3 { margin:0 0 10px; font-size:16px; }
  .months { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .mcard { background:#fff; border:1px solid var(--line); border-top:3px solid var(--gold); padding:12px 14px; cursor:pointer; }
  .mcard:hover { box-shadow:0 2px 10px rgba(15,42,67,.08); }
  .mcard .mh { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; } .mcard .mh b { font-family:'Fraunces',serif; font-size:16px; } .mcard .cnt { font-size:11px; color:var(--ink-soft); }
  .mini { width:100%; border-collapse:collapse; table-layout:fixed; } .mini th { font-size:10px; color:var(--ink-soft); font-weight:600; padding:2px 0; } .mini td { text-align:center; font-size:11px; padding:2px 0 4px; height:28px; vertical-align:top; }
  .mini td.today span.n { background:var(--ink); color:#fff; border-radius:50%; display:inline-block; width:18px; height:18px; line-height:18px; }
  .dots { display:flex; gap:2px; justify-content:center; height:5px; margin-top:1px; } .dots i { width:5px; height:5px; border-radius:50%; display:block; }
  .big { width:100%; border-collapse:collapse; table-layout:fixed; background:#fff; border:1px solid var(--line); }
  .big th { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); padding:8px; border-bottom:2px solid var(--ink); text-align:left; }
  .big td { border:1px solid var(--line); vertical-align:top; height:104px; padding:4px 5px; }
  .big td.empty { background:#FBFAF7; } .big td.today { background:#FFF9E8; } .big .dn { font-size:12px; font-weight:600; color:var(--ink-soft); display:flex; justify-content:space-between; }
  .ev { display:block; width:100%; text-align:left; border:none; border-left:3px solid; border-radius:2px; padding:2px 5px; margin-top:3px; font-size:11px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:inherit; }
  .ev.cancelled { text-decoration:line-through; opacity:.55; }
  .addday { border:none; background:none; color:var(--blue); cursor:pointer; font-size:14px; padding:0; line-height:1; }
  .list .row { display:grid; grid-template-columns:130px 1fr auto; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; align-items:center; }
  .list .row:last-child { border:none; } .list .when { font-size:12px; color:var(--ink-soft); } .list .t { font-weight:600; } .list .meta { font-size:12px; color:var(--ink-soft); }
  .badge { display:inline-block; font-size:11px; padding:2px 9px; border-radius:20px; font-weight:600; white-space:nowrap; }
  .muted { color:var(--ink-soft); font-size:12px; }
  .overlay { display:none; position:fixed; inset:0; background:rgba(15,42,67,.45); align-items:center; justify-content:center; z-index:50; padding:20px; } .overlay.open { display:flex; }
  .modal { background:#fff; width:540px; max-width:94vw; max-height:90vh; overflow-y:auto; padding:24px 26px; border-radius:4px; } .modal h2 { margin:0 0 6px; font-size:20px; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:6px 14px; font-size:13px; margin:12px 0; } .kv dt { color:var(--ink-soft); font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding-top:2px; } .kv dd { margin:0; white-space:pre-wrap; }
  .field { margin-bottom:11px; } .field label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:4px; }
  .field input[type=text], .field input[type=date], .field input[type=time], .field select, .field textarea { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:3px; font:inherit; font-size:13px; } .field textarea { min-height:70px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .check { display:flex; gap:6px; align-items:center; font-size:13px; margin:6px 0; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; flex-wrap:wrap; } #formError { color:var(--danger); font-size:12px; min-height:16px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:4px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:80; max-width:90vw; } .toast.show { opacity:1; } .toast.error { background:var(--danger); }
  @media (max-width:760px) { main { padding:14px 12px 50px; } header.top { padding:16px; } .big td { height:70px; } .ev { font-size:10px; padding:1px 3px; } .list .row { grid-template-columns:1fr; gap:2px; } }
</style>
</head>
<body>
<div id="authScreen"><div class="seal">HAE</div><div class="auth-card"><h1>Events and Calendar</h1><p>Hospital at Ekhaya — sign in with your Ekhaya Connect account</p>
  <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" /><input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" /><button id="loginBtn">Sign in</button><div id="authError"></div></div></div>
<div id="app">
  <header class="top"><div><div class="eyebrow">Hospital at Ekhaya — Health Observance and Events Calendar</div><h1>Events and Calendar</h1></div><div class="who"><div id="whoName">—</div><button id="signOutBtn">Sign out</button></div></header>
  <main id="view"><div class="muted">Loading…</div></main>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBla6UBluNcWVKPSU8U30IuTSubLb7R2Kc", authDomain: "hae-vuma-92fca.firebaseapp.com", projectId: "hae-vuma-92fca",
  storageBucket: "hae-vuma-92fca.firebasestorage.app", messagingSenderId: "1052424261313", appId: "1:1052424261313:web:a4bebe68d6f9ba14fa0e40",
};
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

/*LOGIC_START*/
const pad = (n) => String(n).padStart(2, '0');
const iso = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;                       // m is 1-12
const daysInMonth = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
function parseISO(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? { y: +m[1], m: +m[2], d: +m[3] } : null; }
// Turns stored events into the occurrences that touch year Y. A yearly event keeps its month and day and moves to each year.
function occurrencesForYear(events, Y) {
  const out = [];
  for (const e of events) {
    const s = parseISO(e.startDate); if (!s) continue; const en = parseISO(e.endDate) || s;
    const span = Math.max(0, en.y - s.y);
    const bases = e.recurrence === 'yearly' ? [Y - 1, Y] : [s.y];
    for (const by of bases) {
      const start = iso(by, s.m, Math.min(s.d, daysInMonth(by, s.m)));
      const end = iso(by + span, en.m, Math.min(en.d, daysInMonth(by + span, en.m)));
      if (start > end) continue;
      if (end < iso(Y, 1, 1) || start > iso(Y, 12, 31)) continue;
      out.push({ ...e, occStart: start, occEnd: end });
    }
  }
  return out;
}
const eventsOnDay = (occ, dateISO) => occ.filter((o) => o.occStart <= dateISO && dateISO <= o.occEnd);
function monthGrid(Y, M) {                                                   // weeks start on Monday; null = empty cell
  const lead = (new Date(Date.UTC(Y, M - 1, 1)).getUTCDay() + 6) % 7; const cells = [];
  for (let i = 0; i < lead; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth(Y, M); d++) cells.push(d);
  while (cells.length % 7) cells.push(null);
  const weeks = []; for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7)); return weeks;
}
const sortOcc = (a, b) => a.occStart.localeCompare(b.occStart) || String(a.startTime || '').localeCompare(String(b.startTime || '')) || String(a.title).localeCompare(String(b.title));
const nextEvents = (occ, fromISO, n) => occ.filter((o) => o.occEnd >= fromISO && o.status !== 'cancelled').sort(sortOcc).slice(0, n);
/*LOGIC_END*/

const CLASSES = {
  'observance': { label: 'Health observance', color: '#1E6F4C', bg: '#E4F2EA' },
  'campaign': { label: 'Health campaign / marketing drive', color: '#B8912F', bg: '#F6EDD3' },
  'board-committee': { label: 'Board and committee meeting', color: '#0F2A43', bg: '#DCE6F0' },
  'training': { label: 'Training', color: '#1E5F8F', bg: '#E1EEF7' },
  'inspection': { label: 'Inspection and compliance', color: '#A6303A', bg: '#F8E4E6' },
  'staff-social': { label: 'Staff and social', color: '#7A3FA0', bg: '#EDE3F4' },
  'public-holiday': { label: 'Public holiday', color: '#6B7280', bg: '#EDEDED' },
};
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const now = new Date(); const TODAY = iso(now.getFullYear(), now.getMonth() + 1, now.getDate());
let me = null, events = [];
let st = { year: now.getFullYear(), month: null, off: new Set(), q: '' };
function toast(m, t) { const el = $('toast'); el.textContent = m; el.className = 'toast show' + (t === 'error' ? ' error' : ''); clearTimeout(toast._t); toast._t = setTimeout(() => { el.className = 'toast'; }, 4000); }

$('loginBtn').addEventListener('click', async () => { $('authError').textContent = ''; try { await signInWithEmailAndPassword(auth, $('loginEmail').value.trim(), $('loginPassword').value); } catch (e) { $('authError').textContent = 'Sign-in failed: ' + (e.code || e.message); } });
$('signOutBtn').addEventListener('click', () => signOut(auth));
onAuthStateChanged(auth, async (user) => {
  if (!user) { $('authScreen').style.display = 'flex'; $('app').style.display = 'none'; return; }
  let levels = []; try { const s = await getDoc(doc(db, 'access_control', user.uid)); levels = s.exists() ? (s.data().accessLevels || []) : []; } catch (e) { console.warn(e); }
  me = { uid: user.uid, email: user.email, isExec: levels.includes('executive') };
  $('authScreen').style.display = 'none'; $('app').style.display = 'block'; $('whoName').textContent = user.displayName || user.email;
  await load(); render();
});
async function load() {
  try { const s = await getDocs(collection(db, 'calendar_events')); events = s.docs.map((d) => ({ id: d.id, ...d.data() })); }
  catch (e) { console.error(e); toast('Could not load events: ' + (e.code || e.message), 'error'); }
}
const visible = (o) => !st.off.has(o.eventClass) && (!st.q || (o.title + ' ' + (o.venue || '') + ' ' + (o.description || '') + ' ' + (o.organiser || '')).toLowerCase().includes(st.q.toLowerCase()));
const cls = (o) => CLASSES[o.eventClass] || CLASSES.observance;
const fmtDate = (s) => { const p = parseISO(s); return p ? `${p.d} ${MONTHS[p.m - 1].slice(0, 3)} ${p.y}` : ''; };
const range = (o) => o.occStart === o.occEnd ? fmtDate(o.occStart) : fmtDate(o.occStart) + ' to ' + fmtDate(o.occEnd);
const timeText = (o) => o.allDay || !o.startTime ? 'All day' : o.startTime + (o.endTime ? '–' + o.endTime : '');

function render() { st.month ? renderMonth() : renderYear(); }
function filtersHtml() {
  return `<div class="filters">${Object.entries(CLASSES).map(([k, c]) => `<button class="chip ${st.off.has(k) ? 'off' : ''}" data-cls="${k}"><span class="dot" style="background:${c.color}"></span>${esc(c.label)}</button>`).join('')}<input type="search" id="q" placeholder="Search events" value="${esc(st.q)}" /></div>`;
}
function bindFilters() {
  document.querySelectorAll('[data-cls]').forEach((b) => b.addEventListener('click', () => { st.off.has(b.dataset.cls) ? st.off.delete(b.dataset.cls) : st.off.add(b.dataset.cls); render(); }));
  $('q').addEventListener('input', (e) => { st.q = e.target.value; render(); $('q').focus(); $('q').setSelectionRange(st.q.length, st.q.length); });
}

function renderYear() {
  const occ = occurrencesForYear(events, st.year).filter(visible);
  const upcoming = nextEvents([...occurrencesForYear(events, now.getFullYear()), ...occurrencesForYear(events, now.getFullYear() + 1)].filter(visible), TODAY, 6);
  $('view').innerHTML = `
    <div class="bar"><div class="nav"><button class="btn" id="py">‹</button><h2>${st.year}</h2><button class="btn" id="ny">›</button><button class="btn ghost" id="ty">This year</button></div>
      ${me.isExec ? '<button class="btn solid" id="addBtn">+ Add event</button>' : ''}</div>
    ${filtersHtml()}
    ${upcoming.length ? `<div class="card"><h3>Coming up</h3><div class="list">${upcoming.map((o, i) => `<div class="row" data-up="${i}"><div class="when">${esc(range(o))}</div><div><div class="t">${esc(o.title)}</div><div class="meta">${esc(timeText(o))}${o.venue ? ' · ' + esc(o.venue) : ''}</div></div><span class="badge" style="background:${cls(o).bg};color:${cls(o).color}">${esc(cls(o).label)}</span></div>`).join('')}</div></div>` : ''}
    <div class="months">${MONTHS.map((name, mi) => monthCard(name, mi + 1, occ)).join('')}</div>`;
  $('py').onclick = () => { st.year--; render(); }; $('ny').onclick = () => { st.year++; render(); }; $('ty').onclick = () => { st.year = now.getFullYear(); render(); };
  if (me.isExec) $('addBtn').onclick = () => editEvent(null, TODAY);
  document.querySelectorAll('[data-m]').forEach((el) => el.addEventListener('click', () => { st.month = +el.dataset.m; render(); window.scrollTo(0, 0); }));
  document.querySelectorAll('[data-up]').forEach((el) => el.addEventListener('click', () => showEvent(upcoming[+el.dataset.up])));
  bindFilters();
}
function monthCard(name, M, occ) {
  const inMonth = occ.filter((o) => o.occStart <= iso(st.year, M, daysInMonth(st.year, M)) && o.occEnd >= iso(st.year, M, 1));
  const live = inMonth.filter((o) => o.status !== 'cancelled').length;
  const weeks = monthGrid(st.year, M);
  return `<div class="mcard" data-m="${M}"><div class="mh"><b>${name}</b><span class="cnt">${live ? live + ' event' + (live === 1 ? '' : 's') : ''}</span></div>
    <table class="mini"><thead><tr>${DOW.map((d) => `<th>${d[0]}</th>`).join('')}</tr></thead><tbody>${weeks.map((w) => `<tr>${w.map((d) => {
      if (!d) return '<td></td>'; const ds = iso(st.year, M, d); const on = eventsOnDay(inMonth, ds).filter((o) => o.status !== 'cancelled').slice(0, 3);
      return `<td class="${ds === TODAY ? 'today' : ''}"><span class="n">${d}</span><div class="dots">${on.map((o) => `<i style="background:${cls(o).color}"></i>`).join('')}</div></td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function renderMonth() {
  const M = st.month, Y = st.year; const occ = occurrencesForYear(events, Y).filter(visible);
  const weeks = monthGrid(Y, M); const inMonth = occ.filter((o) => o.occStart <= iso(Y, M, daysInMonth(Y, M)) && o.occEnd >= iso(Y, M, 1)).sort(sortOcc);
  $('view').innerHTML = `
    <div class="bar"><div class="nav"><button class="btn ghost" id="back">‹ ${Y}</button><button class="btn" id="pm">‹</button><h2>${MONTHS[M - 1]} ${Y}</h2><button class="btn" id="nm">›</button></div>${me.isExec ? '<button class="btn solid" id="addBtn">+ Add event</button>' : ''}</div>
    ${filtersHtml()}
    <table class="big"><thead><tr>${DOW.map((d) => `<th>${d}</th>`).join('')}</tr></thead><tbody>${weeks.map((w) => `<tr>${w.map((d) => {
      if (!d) return '<td class="empty"></td>'; const ds = iso(Y, M, d); const on = eventsOnDay(inMonth, ds).sort(sortOcc);
      return `<td class="${ds === TODAY ? 'today' : ''}"><div class="dn"><span>${d}</span>${me.isExec ? `<button class="addday" data-add="${ds}" title="Add an event on this day">+</button>` : ''}</div>${on.map((o) => `<button class="ev ${o.status === 'cancelled' ? 'cancelled' : ''}" data-ev="${esc(o.id)}|${o.occStart}" style="background:${cls(o).bg};border-color:${cls(o).color}" title="${esc(o.title)}">${esc(o.title)}</button>`).join('')}</td>`; }).join('')}</tr>`).join('')}</tbody></table>
    <div class="card" style="margin-top:16px"><h3>${MONTHS[M - 1]} in detail</h3>${inMonth.length ? `<div class="list">${inMonth.map((o, i) => `<div class="row" data-li="${i}"><div class="when">${esc(range(o))}</div><div><div class="t" ${o.status === 'cancelled' ? 'style="text-decoration:line-through"' : ''}>${esc(o.title)}${o.toConfirm ? ' <span class="muted">(date to confirm)</span>' : ''}</div><div class="meta">${esc(timeText(o))}${o.venue ? ' · ' + esc(o.venue) : ''}${o.organiser ? ' · ' + esc(o.organiser) : ''}</div></div><span class="badge" style="background:${cls(o).bg};color:${cls(o).color}">${esc(cls(o).label)}</span></div>`).join('')}</div>` : '<div class="muted">No events this month.</div>'}</div>`;
  $('back').onclick = () => { st.month = null; render(); };
  $('pm').onclick = () => { if (st.month === 1) { st.month = 12; st.year--; } else st.month--; render(); };
  $('nm').onclick = () => { if (st.month === 12) { st.month = 1; st.year++; } else st.month++; render(); };
  if (me.isExec) { $('addBtn').onclick = () => editEvent(null, iso(Y, M, 1)); document.querySelectorAll('[data-add]').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); editEvent(null, b.dataset.add); })); }
  document.querySelectorAll('[data-ev]').forEach((b) => b.addEventListener('click', () => { const [id, os] = b.dataset.ev.split('|'); showEvent(inMonth.find((o) => o.id === id && o.occStart === os)); }));
  document.querySelectorAll('[data-li]').forEach((b) => b.addEventListener('click', () => showEvent(inMonth[+b.dataset.li])));
  bindFilters();
}

function closeModal() { $('overlay').classList.remove('open'); $('modal').innerHTML = ''; }
function showEvent(o) {
  if (!o) return; const c = cls(o);
  $('modal').innerHTML = `<span class="badge" style="background:${c.bg};color:${c.color}">${esc(c.label)}</span><h2 style="margin-top:8px">${esc(o.title)}</h2>
    ${o.status === 'cancelled' ? '<div class="badge" style="background:var(--danger-soft);color:var(--danger)">Cancelled</div>' : ''}
    <dl class="kv"><dt>When</dt><dd>${esc(range(o))}${o.toConfirm ? ' (date to confirm)' : ''}<br>${esc(timeText(o))}</dd>
      ${o.venue ? `<dt>Where</dt><dd>${esc(o.venue)}</dd>` : ''}${o.organiser ? `<dt>Organiser</dt><dd>${esc(o.organiser)}</dd>` : ''}
      <dt>Status</dt><dd>${esc(o.status || 'planned')}</dd>${o.recurrence === 'yearly' ? '<dt>Repeats</dt><dd>Every year</dd>' : ''}${o.description ? `<dt>Details</dt><dd>${esc(o.description)}</dd>` : ''}</dl>
    <div class="modal-actions">${me.isExec ? '<button class="btn" id="mEdit">Edit</button>' : ''}<button class="btn solid" id="mClose">Close</button></div>`;
  $('overlay').classList.add('open'); $('mClose').onclick = closeModal; if (me.isExec) $('mEdit').onclick = () => editEvent(events.find((e) => e.id === o.id), null);
}

function editEvent(ev, presetDate) {
  const isNew = !ev; const e = ev || { title: '', eventClass: 'campaign', startDate: presetDate || TODAY, endDate: '', allDay: true, startTime: '', endTime: '', venue: '', organiser: '', description: '', status: 'planned', recurrence: 'none', toConfirm: false };
  $('modal').innerHTML = `<h2>${isNew ? 'Add an event' : 'Edit event'}</h2>
    <div class="field"><label>Title</label><input type="text" id="f_title" value="${esc(e.title)}" maxlength="140" /></div>
    <div class="field"><label>Class</label><select id="f_cls">${Object.entries(CLASSES).map(([k, c]) => `<option value="${k}" ${e.eventClass === k ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}</select></div>
    <div class="two"><div class="field"><label>Start date</label><input type="date" id="f_start" value="${esc(e.startDate)}" /></div><div class="field"><label>End date (optional)</label><input type="date" id="f_end" value="${esc(e.endDate || '')}" /></div></div>
    <label class="check"><input type="checkbox" id="f_all" ${e.allDay ? 'checked' : ''} /> All day</label>
    <div class="two" id="times"><div class="field"><label>Start time</label><input type="time" id="f_st" value="${esc(e.startTime || '')}" /></div><div class="field"><label>End time</label><input type="time" id="f_et" value="${esc(e.endTime || '')}" /></div></div>
    <div class="two"><div class="field"><label>Venue</label><input type="text" id="f_venue" value="${esc(e.venue || '')}" /></div><div class="field"><label>Organiser</label><input type="text" id="f_org" value="${esc(e.organiser || '')}" /></div></div>
    <div class="field"><label>Details</label><textarea id="f_desc">${esc(e.description || '')}</textarea></div>
    <div class="two"><div class="field"><label>Status</label><select id="f_status">${['planned', 'confirmed', 'cancelled'].map((s) => `<option ${e.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div></div>
    <label class="check"><input type="checkbox" id="f_yearly" ${e.recurrence === 'yearly' ? 'checked' : ''} /> Repeats every year on the same date</label>
    <label class="check"><input type="checkbox" id="f_confirm" ${e.toConfirm ? 'checked' : ''} /> The date moves from year to year: confirm each year</label>
    <div id="formError"></div>
    <div class="modal-actions"><button class="btn" id="fCancel">Cancel</button><button class="btn solid" id="fSave">Save</button></div>`;
  $('overlay').classList.add('open');
  const syncTimes = () => { $('times').style.display = $('f_all').checked ? 'none' : 'grid'; }; syncTimes(); $('f_all').onchange = syncTimes;
  $('fCancel').onclick = closeModal;
  $('fSave').onclick = async () => {
    const title = $('f_title').value.trim(), start = $('f_start').value, end = $('f_end').value;
    if (!title) { $('formError').textContent = 'Please give the event a title.'; return; } if (!parseISO(start)) { $('formError').textContent = 'Please choose a start date.'; return; }
    if (end && end < start) { $('formError').textContent = 'The end date is before the start date.'; return; }
    const data = { title, eventClass: $('f_cls').value, startDate: start, endDate: end || null, allDay: $('f_all').checked, startTime: $('f_all').checked ? '' : $('f_st').value, endTime: $('f_all').checked ? '' : $('f_et').value,
      venue: $('f_venue').value.trim(), organiser: $('f_org').value.trim(), description: $('f_desc').value.trim(), status: $('f_status').value, recurrence: $('f_yearly').checked ? 'yearly' : 'none', toConfirm: $('f_confirm').checked,
      updatedAt: serverTimestamp(), updatedBy: me.email };
    $('fSave').disabled = true;
    try {
      let id; if (isNew) { data.createdAt = serverTimestamp(); data.createdBy = me.email; const r = await addDoc(collection(db, 'calendar_events'), data); id = r.id; } else { id = ev.id; await updateDoc(doc(db, 'calendar_events', id), data); }
      await addDoc(collection(db, 'calendar_audit'), { eventId: id, action: (isNew ? 'Event added: ' : 'Event edited: ') + title, by: me.email, at: serverTimestamp() });
      closeModal(); toast('Saved.'); await load(); render();
    } catch (err) { console.error(err); $('formError').textContent = 'Could not save: ' + (err.code || err.message); $('fSave').disabled = false; }
  };
}
$('overlay').addEventListener('click', (e) => { if (e.target === $('overlay')) closeModal(); });
</script>
</body>
</html>
