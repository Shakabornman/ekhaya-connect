REPLACE with:

  <div class="tool-icon" style="background:#FEF3C7">🔄</div>
  <div class="tool-name">Force Rollup</div>
  <div class="tool-desc">Manually trigger scorecard rollup</div>

AND add this function alongside the other window.* function definitions in the <script type="module"> block
(e.g. near window.showToast):

// ── FORCE ROLLUP ──────────────────────────────────────────────────────────
// Prompts for a week-ending date (Thursday, YYYY-MM-DD) so a past week can be
// re-rolled after late/backdated submissions. Leave blank for the current week.
window.forceRollup = function() {
  const input = window.prompt(
    'Week ending date to roll up (YYYY-MM-DD, must be a Thursday).\n' +
    'Leave blank to roll up the current week.'
  );
  if (input === null) return; // cancelled

  const trimmed = input.trim();
  let url = 'https://manualrollup-gldcmcru2q-ew.a.run.app';

  if (trimmed) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) {
      showToast('Enter the date as YYYY-MM-DD (e.g. 2026-07-09)');
      return;
    }
    url += '?week=' + encodeURIComponent(trimmed);
  }

  window.open(url, '_blank');
  showToast(trimmed ? `Rolling up week ending ${trimmed}…` : 'Rolling up current week…');
};
